name: 数据与产出校验

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 1. 隐私检查：产物中不得出现任何邮箱 ──
      - name: 检查邮箱残留（隐私红线）
        run: node tools/strip_emails.mjs --check

      # ── 2. 数据文件可解析（只校验入库文件）──
      - name: 校验 JSON 数据文件
        run: |
          node -e "
          const fs=require('fs'),path=require('path');
          const files=[];
          for(const f of fs.readdirSync('data/processed')) if(f.endsWith('.json')) files.push('data/processed/'+f);
          for(const d of fs.readdirSync('data/raw')){
            const dir=path.join('data/raw',d);
            if(!fs.statSync(dir).isDirectory()) continue;
            for(const f of fs.readdirSync(dir)) if(/^roster_.*\.json$/.test(f)) files.push(path.join(dir,f));
          }
          let bad=0;
          for(const p of files){
            try{ JSON.parse(fs.readFileSync(p,'utf8').replace(/^\ufeff/,'')); }
            catch(e){ console.log('❌ JSON 解析失败:',p,e.message); bad++; }
          }
          console.log('已校验入库 JSON 文件:',files.length,'| 失败:',bad);
          process.exit(bad?1:0);
          "

      # ── 3. HTML 产出完整性 ──
      - name: 校验 HTML 产出
        run: node tools/verify_html.mjs reports/*.html

      # ── 4. 关键字段存在性 ──
      - name: 校验数据完整性
        run: |
          node -e "
          const fs=require('fs');
          const ranked=JSON.parse(fs.readFileSync('data/processed/mentor_ranked.json','utf8'));
          const curated=JSON.parse(fs.readFileSync('data/processed/curated.json','utf8'));
          const errs=[];
          if(ranked.length<1000) errs.push('全库人数异常: '+ranked.length);
          if(curated.length<200) errs.push('推荐集人数异常: '+curated.length);
          for(const d of ranked.slice(0,50)){
            for(const k of ['name_cn','school','composite','n_ic_papers','tier'.replace('tier','rank')])
              if(d[k]===undefined) errs.push(d.name_cn+' 缺字段 '+k);
            if('email' in d) errs.push(d.name_cn+' 含 email 字段');
          }
          const em=ranked.filter(d=>'email' in d).length+curated.filter(d=>'email' in d).length;
          if(em) errs.push(em+' 条记录含 email 字段');
          if(errs.length){ console.log('❌', errs.slice(0,10).join('\n')); process.exit(1); }
          console.log('✅ 全库', ranked.length, '条 / 推荐集', curated.length, '条，字段校验通过');
          "

      # ── 5. 渲染文档中的邮箱（docx 反向解包检查）──
      - name: 检查 Word 文档内嵌邮箱
        run: |
          node -e "
          const fs=require('fs'),zlib=require('zlib');
          const RE=/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g;
          let bad=0;
          for(const f of fs.readdirSync('reports')){
            if(!f.endsWith('.docx')) continue;
            const buf=fs.readFileSync('reports/'+f).toString('latin1');
            const hits=(buf.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g)||[])
              .filter(x=>!/\.(xml|rels|png|jpe?g)$/i.test(x));
            if(hits.length){ console.log('❌',f,hits.slice(0,3)); bad+=hits.length; }
          }
          console.log(bad?('发现 '+bad+' 处'):'✅ Word 文档检查通过');
          process.exit(bad?1:0);
          "

  # ── 当前作品（workbench 工作台 + AIC 提交材料）────────────────────
  # 上面那个 job 校验的是早期 IC 专题的数据产出；本 job 校验现在要交付的东西。
  # 只跑标准库可完成的检查，避免在 CI 里装 fastembed/onnxruntime。
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装轻量依赖（仅用于报告页数校验）
        run: python -m pip install --quiet pypdf

      - name: Python 语法检查（全包编译）
        run: python -m compileall -q workbench

      - name: 编码体检（被 cmd.exe / pip / git 读取的文件）
        run: python -m workbench.tools.encoding_audit

      - name: README 徽章与体积表
        run: python -m workbench.tools.check_readme_badges

      - name: 技术报告三件产物同步
        run: python -m workbench.tools.check_report_sync

      - name: 技术报告页数与大小限制
        run: python -m workbench.tools.check_pdf_limits
